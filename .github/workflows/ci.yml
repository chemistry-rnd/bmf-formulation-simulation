name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/run_simulation.py --formulas all --scenarios 25 --seed 123 --mode mock --output-dir simulation-output
      - run: python scripts/generate_research_report.py --input-dir simulation-output --output-dir simulation-output
