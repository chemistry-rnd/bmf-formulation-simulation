name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/run_simulation.py --formulas all --scenarios 25 --seed 123 --mode mock --output-dir simulation-output
      - run: python scripts/generate_research_report.py --input-dir simulation-output --output-dir simulation-output --run-id "${{ github.run_id }}"
      - run: python scripts/package_research_data.py --input-dir simulation-output --output-dir bmf-research-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BMF-Research-Report-${{ github.run_id }}
          path: simulation-output/BMF-Research-Report.md
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BMF-Research-Data-${{ github.run_id }}
          path: bmf-research-data/
          retention-days: 7
