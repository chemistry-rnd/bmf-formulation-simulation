name: Formulation Simulation

on:
  workflow_dispatch:
    inputs:
      formulas:
        description: "Formulas to run"
        required: true
        type: choice
        options:
          - all
          - A
          - B
          - C
        default: "all"
      scenarios:
        description: "Virtual scenarios per formula (default 1000, max 10000)"
        required: true
        default: "1000"
      seed:
        description: "Random seed for reproducibility"
        required: true
        default: "20261013"
      formula_count:
        description: "Distinct formulations to screen (blank uses mode default: mock 50, pilot 1000, full 10000)"
        required: false
        default: ""
      mode:
        description: "Execution mode"
        required: true
        type: choice
        options:
          - mock
          - pilot
          - full
        default: "pilot"

permissions:
  contents: read

concurrency:
  group: formulation-simulation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run simulation
        env:
          FORMULAS: ${{ inputs.formulas }}
          SCENARIOS: ${{ inputs.scenarios }}
          SEED: ${{ inputs.seed }}
          MODE: ${{ inputs.mode }}
        env:
          FORMULA_COUNT: ${{ inputs.formula_count }}
        run: |
          set -euo pipefail
          rm -rf simulation-output
          if [ -n "${FORMULA_COUNT:-}" ]; then
            FC_ARG=(--formula-count "$FORMULA_COUNT")
          else
            FC_ARG=()
          fi
          python scripts/run_simulation.py \
            --formulas "$FORMULAS" \
            --scenarios "$SCENARIOS" \
            --seed "$SEED" \
            --mode "$MODE" \
            "${FC_ARG[@]}" \
            --output-dir simulation-output

      - name: Generate research report
        run: |
          set -euo pipefail
          python scripts/generate_research_report.py --input-dir simulation-output --output-dir simulation-output --run-id "${{ github.run_id }}"

      - name: Stage research data package
        run: |
          set -euo pipefail
          rm -rf bmf-research-data
          python scripts/package_research_data.py --input-dir simulation-output --output-dir bmf-research-data

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          cd simulation-output
          sha256sum -c sha256sums.txt

      - name: Publish report to job summary
        if: always()
        shell: bash
        run: |
          if [ -f simulation-output/BMF-Research-Report.md ]; then
            cat simulation-output/BMF-Research-Report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload standalone report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BMF-Research-Report-${{ github.run_id }}
          path: simulation-output/BMF-Research-Report.md
          retention-days: 30

      - name: Upload structured data package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMF-Research-Data-${{ github.run_id }}
          path: bmf-research-data/
          retention-days: 30
          if-no-files-found: warn
